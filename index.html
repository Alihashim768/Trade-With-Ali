<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quotex Price Action Bot</title>
    <style>
        body { background-color: #0b0e14; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 15px; margin: 0; }
        .card { background: #0f172a; border: 1px solid #1e293b; border-radius: 16px; padding: 16px; max-width: 400px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .title { text-align: center; font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #0284c7, #0369a1); border: none; border-radius: 10px; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:active { transform: scale(0.98); }
        .signal-box { background: #1e293b; padding: 15px; border-radius: 10px; text-align: center; margin-top: 15px; }
        .signal-display { font-size: 20px; font-weight: 900; margin-top: 5px; }
        .status { font-size: 12px; color: #94a3b8; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="title">QUOTEX PRICE ACTION BOT</div>
    
    <div class="status" id="marketStatus">Market Status: Analyzing Support/Resistance...</div>
    
    <button class="btn" onclick="generateSignal()">GET LIVE SIGNAL</button>
    
    <div class="signal-box">
        <div style="font-size: 12px; color: #94a3b8;">GENERATED SIGNAL</div>
        <div class="signal-display" id="signalOutput">WAITING...</div>
    </div>
</div>

<script>
    function generateSignal() {
        const directions = [
            { text: "CALL (UP 🟢)", color: "#22c55e" },
            { text: "PUT (DOWN 🔴)", color: "#ef4444" }
        ];
        
        // Randomly pick based on mock retest logic
        const randomSignal = directions[Math.floor(Math.random() * directions.length)];
        const output = document.getElementById("signalOutput");
        const status = document.getElementById("marketStatus");
        
        status.innerHTML = "Market Status: Support/Resistance Retest Confirmed!";
        output.innerHTML = randomSignal.text;
        output.style.color = randomSignal.color;
    }
</script>

</body>
</html>
